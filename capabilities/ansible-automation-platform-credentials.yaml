naftiko: 1.0.0-alpha2
info:
  label: Red Hat Ansible Automation Platform API — Credentials
  description: 'Red Hat Ansible Automation Platform API — Credentials. 1 operations. Lead operation: Red Hat List Credentials.
    Self-contained Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Credentials
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: ansible-automation-platform-credentials
    baseUri: https://ansible-platform.example.com
    description: Red Hat Ansible Automation Platform API — Credentials business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-credentials
      path: /api/v2/credentials/
      operations:
      - name: listcredentials
        method: GET
        description: Red Hat List Credentials
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: ansible-automation-platform-credentials-rest
    port: 8080
    description: REST adapter for Red Hat Ansible Automation Platform API — Credentials. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/v2/credentials
      name: api-v2-credentials
      description: REST surface for api-v2-credentials.
      operations:
      - method: GET
        name: listcredentials
        description: Red Hat List Credentials
        call: ansible-automation-platform-credentials.listcredentials
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ansible-automation-platform-credentials-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Ansible Automation Platform API — Credentials. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: red-hat-list-credentials
      description: Red Hat List Credentials
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ansible-automation-platform-credentials.listcredentials
      outputParameters:
      - type: object
        mapping: $.
