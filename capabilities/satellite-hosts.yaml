naftiko: 1.0.0-alpha2
info:
  label: Red Hat Satellite API — Hosts
  description: 'Red Hat Satellite API — Hosts. 4 operations. Lead operation: Red Hat List Hosts. Self-contained Naftiko capability
    covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Hosts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: satellite-hosts
    baseUri: https://satellite.example.com
    description: Red Hat Satellite API — Hosts business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-hosts
      path: /api/v2/hosts
      operations:
      - name: listhosts
        method: GET
        description: Red Hat List Hosts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v2-hosts-id
      path: /api/v2/hosts/{id}
      operations:
      - name: gethost
        method: GET
        description: Red Hat Get a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatehost
        method: PUT
        description: Red Hat Update a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletehost
        method: DELETE
        description: Red Hat Delete a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.RED_HAT_USER}}'
      password: '{{env.RED_HAT_PASS}}'
  exposes:
  - type: rest
    namespace: satellite-hosts-rest
    port: 8080
    description: REST adapter for Red Hat Satellite API — Hosts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/hosts
      name: api-v2-hosts
      description: REST surface for api-v2-hosts.
      operations:
      - method: GET
        name: listhosts
        description: Red Hat List Hosts
        call: satellite-hosts.listhosts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/hosts/{id}
      name: api-v2-hosts-id
      description: REST surface for api-v2-hosts-id.
      operations:
      - method: GET
        name: gethost
        description: Red Hat Get a Host
        call: satellite-hosts.gethost
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatehost
        description: Red Hat Update a Host
        call: satellite-hosts.updatehost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletehost
        description: Red Hat Delete a Host
        call: satellite-hosts.deletehost
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: satellite-hosts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Satellite API — Hosts. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: red-hat-list-hosts
      description: Red Hat List Hosts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: satellite-hosts.listhosts
      outputParameters:
      - type: object
        mapping: $.
    - name: red-hat-get-host
      description: Red Hat Get a Host
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: satellite-hosts.gethost
      outputParameters:
      - type: object
        mapping: $.
    - name: red-hat-update-host
      description: Red Hat Update a Host
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: satellite-hosts.updatehost
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: red-hat-delete-host
      description: Red Hat Delete a Host
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: satellite-hosts.deletehost
      outputParameters:
      - type: object
        mapping: $.
