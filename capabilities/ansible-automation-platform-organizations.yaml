naftiko: 1.0.0-alpha2
info:
  label: Red Hat Ansible Automation Platform API — Organizations
  description: 'Red Hat Ansible Automation Platform API — Organizations. 1 operations. Lead operation: Red Hat List Organizations.
    Self-contained Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Organizations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: ansible-automation-platform-organizations
    baseUri: https://ansible-platform.example.com
    description: Red Hat Ansible Automation Platform API — Organizations business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-organizations
      path: /api/v2/organizations/
      operations:
      - name: listorganizations
        method: GET
        description: Red Hat List Organizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: ansible-automation-platform-organizations-rest
    port: 8080
    description: REST adapter for Red Hat Ansible Automation Platform API — Organizations. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/v2/organizations
      name: api-v2-organizations
      description: REST surface for api-v2-organizations.
      operations:
      - method: GET
        name: listorganizations
        description: Red Hat List Organizations
        call: ansible-automation-platform-organizations.listorganizations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ansible-automation-platform-organizations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Ansible Automation Platform API — Organizations. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: red-hat-list-organizations
      description: Red Hat List Organizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ansible-automation-platform-organizations.listorganizations
      outputParameters:
      - type: object
        mapping: $.
