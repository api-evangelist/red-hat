naftiko: 1.0.0-alpha2
info:
  label: Red Hat Build of Keycloak Admin REST API — Groups
  description: 'Red Hat Build of Keycloak Admin REST API — Groups. 1 operations. Lead operation: Red Hat List Groups. Self-contained
    Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: keycloak-admin-groups
    baseUri: https://keycloak.example.com
    description: Red Hat Build of Keycloak Admin REST API — Groups business capability. Self-contained, no shared references.
    resources:
    - name: admin-realms-realm-groups
      path: /admin/realms/{realm}/groups
      operations:
      - name: listgroups
        method: GET
        description: Red Hat List Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search
          in: query
          type: string
          description: Filter groups by name.
        - name: first
          in: query
          type: integer
          description: Pagination offset.
        - name: max
          in: query
          type: integer
          description: Maximum number of results.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: keycloak-admin-groups-rest
    port: 8080
    description: REST adapter for Red Hat Build of Keycloak Admin REST API — Groups. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/admin/realms/{realm}/groups
      name: admin-realms-realm-groups
      description: REST surface for admin-realms-realm-groups.
      operations:
      - method: GET
        name: listgroups
        description: Red Hat List Groups
        call: keycloak-admin-groups.listgroups
        with:
          search: rest.search
          first: rest.first
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: keycloak-admin-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Build of Keycloak Admin REST API — Groups. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: red-hat-list-groups
      description: Red Hat List Groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: keycloak-admin-groups.listgroups
      with:
        search: tools.search
        first: tools.first
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
