naftiko: 1.0.0-alpha2
info:
  label: Red Hat OpenShift Cluster Manager API — Add-Ons
  description: 'Red Hat OpenShift Cluster Manager API — Add-Ons. 1 operations. Lead operation: Red Hat List Add-ons. Self-contained
    Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Add-Ons
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openshift-cluster-manager-add-ons
    baseUri: https://api.openshift.com
    description: Red Hat OpenShift Cluster Manager API — Add-Ons business capability. Self-contained, no shared references.
    resources:
    - name: api-clusters_mgmt-v1-addons
      path: /api/clusters_mgmt/v1/addons
      operations:
      - name: listaddons
        method: GET
        description: Red Hat List Add-ons
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: openshift-cluster-manager-add-ons-rest
    port: 8080
    description: REST adapter for Red Hat OpenShift Cluster Manager API — Add-Ons. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/clusters-mgmt/v1/addons
      name: api-clusters-mgmt-v1-addons
      description: REST surface for api-clusters_mgmt-v1-addons.
      operations:
      - method: GET
        name: listaddons
        description: Red Hat List Add-ons
        call: openshift-cluster-manager-add-ons.listaddons
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openshift-cluster-manager-add-ons-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat OpenShift Cluster Manager API — Add-Ons. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: red-hat-list-add-ons
      description: Red Hat List Add-ons
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openshift-cluster-manager-add-ons.listaddons
      outputParameters:
      - type: object
        mapping: $.
