naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Quay API"
  description: "Container registry API for managing repositories, images, tags, organizations, teams, robot accounts, and vulnerability scanning."
  tags:
    - Red Hat
    - Quay
    - Container Registry
    - Security
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      QUAY_BEARER_TOKEN: QUAY_BEARER_TOKEN

capability:
  consumes:
    - type: http
      namespace: quay
      baseUri: https://quay.io/api/v1
      description: "Red Hat Quay container registry API."
      authentication:
        type: bearer
        token: "{{QUAY_BEARER_TOKEN}}"
      resources:
        - name: repositories
          path: /repository
          description: "Container image repositories."
          operations:
            - name: list-repositories
              method: GET
              description: "List visible repositories."
              inputParameters:
                - name: namespace
                  in: query
                  type: string
                  required: false
                  description: "Filter by namespace"
                - name: starred
                  in: query
                  type: boolean
                  required: false
                  description: "Filter starred repos"
                - name: public
                  in: query
                  type: boolean
                  required: false
                  description: "Include public repos"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-repository
              method: POST
              description: "Create a new repository."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  namespace: "{{tools.namespace}}"
                  repository: "{{tools.repository}}"
                  visibility: "{{tools.visibility}}"

            - name: get-repository
              method: GET
              description: "Get repository details."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path (namespace/name)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-repository
              method: DELETE
              description: "Delete a repository."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tags
          path: /repository/{repository}/tag
          description: "Image tags."
          operations:
            - name: list-repository-tags
              method: GET
              description: "List tags for a repository."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: change-tag
              method: PUT
              description: "Change or create a tag."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path"
                - name: tag
                  in: path
                  type: string
                  required: true
                  description: "Tag name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-tag
              method: DELETE
              description: "Delete a tag."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path"
                - name: tag
                  in: path
                  type: string
                  required: true
                  description: "Tag name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: manifests
          path: /repository/{repository}/manifest
          description: "Image manifests and security scanning."
          operations:
            - name: get-manifest-security
              method: GET
              description: "Get security scan results for a manifest."
              inputParameters:
                - name: repository
                  in: path
                  type: string
                  required: true
                  description: "Repository path"
                - name: manifestref
                  in: path
                  type: string
                  required: true
                  description: "Manifest digest"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: organizations
          path: /organization
          description: "Organization management."
          operations:
            - name: get-organization
              method: GET
              description: "Get organization details."
              inputParameters:
                - name: orgname
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: robot-accounts
          path: /organization/{orgname}/robots
          description: "Robot accounts for automated access."
          operations:
            - name: get-org-robot
              method: GET
              description: "Get a robot account."
              inputParameters:
                - name: orgname
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: robot_shortname
                  in: path
                  type: string
                  required: true
                  description: "Robot short name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-org-robot
              method: PUT
              description: "Create or update a robot account."
              inputParameters:
                - name: orgname
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: robot_shortname
                  in: path
                  type: string
                  required: true
                  description: "Robot short name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: users
          path: /user
          description: "User operations."
          operations:
            - name: get-logged-in-user
              method: GET
              description: "Get the currently logged-in user."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8104
      namespace: quay-api
      resources:
        - path: /v1/repositories
          name: repositories
          description: "Container repositories."
          operations:
            - method: GET
              name: list-repositories
              description: "List repositories."
              call: "quay.list-repositories"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/repositories/{repository}/tags
          name: tags
          description: "Image tags."
          operations:
            - method: GET
              name: list-repository-tags
              description: "List repository tags."
              call: "quay.list-repository-tags"
              with:
                repository: "rest.repository"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9104
      namespace: quay-mcp
      transport: http
      tools:
        - name: list-repositories
          description: "List container image repositories."
          hints:
            readOnly: true
            openWorld: true
          call: "quay.list-repositories"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-repository
          description: "Get repository details."
          hints:
            readOnly: true
            idempotent: true
          call: "quay.get-repository"
          with:
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-repository
          description: "Create a new container repository."
          hints:
            readOnly: false
          call: "quay.create-repository"
          with:
            namespace: "tools.namespace"
            repository: "tools.repository"
            visibility: "tools.visibility"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-repository
          description: "Delete a container repository."
          hints:
            readOnly: false
            destructive: true
          call: "quay.delete-repository"
          with:
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-repository-tags
          description: "List tags for a repository."
          hints:
            readOnly: true
          call: "quay.list-repository-tags"
          with:
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-manifest-security
          description: "Get vulnerability scan results for an image manifest."
          hints:
            readOnly: true
          call: "quay.get-manifest-security"
          with:
            repository: "tools.repository"
            manifestref: "tools.manifestref"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-organization
          description: "Get organization details."
          hints:
            readOnly: true
            idempotent: true
          call: "quay.get-organization"
          with:
            orgname: "tools.orgname"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-logged-in-user
          description: "Get the currently authenticated user."
          hints:
            readOnly: true
          call: "quay.get-logged-in-user"
          outputParameters:
            - type: object
              mapping: "$."
