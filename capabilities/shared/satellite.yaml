naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Satellite API"
  description: "Infrastructure management API covering hosts, content views, environments, errata, repositories, organizations, and host groups for large-scale Linux environments."
  tags:
    - Red Hat
    - Satellite
    - Content Management
    - Patch Management
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      SATELLITE_USERNAME: SATELLITE_USERNAME
      SATELLITE_PASSWORD: SATELLITE_PASSWORD

capability:
  consumes:
    - type: http
      namespace: satellite
      baseUri: https://satellite.example.com
      description: "Red Hat Satellite API for infrastructure and content management."
      authentication:
        type: basic
        username: "{{SATELLITE_USERNAME}}"
        password: "{{SATELLITE_PASSWORD}}"
      resources:
        - name: hosts
          path: /api/v2/hosts
          description: "Manage hosts registered with Satellite."
          operations:
            - name: list-hosts
              method: GET
              description: "List all managed hosts."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search filter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-host
              method: GET
              description: "Get a specific host."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Host ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: update-host
              method: PUT
              description: "Update a host."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Host ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  host:
                    name: "{{tools.name}}"

            - name: delete-host
              method: DELETE
              description: "Delete a host."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Host ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: list-host-errata
              method: GET
              description: "List errata applicable to a host."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Host ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: content-views
          path: /katello/api/v2/content_views
          description: "Manage content views for controlled content delivery."
          operations:
            - name: list-content-views
              method: GET
              description: "List all content views."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-content-view
              method: POST
              description: "Create a new content view."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  organization_id: "{{tools.organization_id}}"

        - name: environments
          path: /katello/api/v2/organizations/{organization_id}/environments
          description: "Manage lifecycle environments."
          operations:
            - name: list-environments
              method: GET
              description: "List lifecycle environments."
              inputParameters:
                - name: organization_id
                  in: path
                  type: integer
                  required: true
                  description: "Organization ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: repositories
          path: /katello/api/v2/repositories
          description: "Manage software repositories."
          operations:
            - name: list-repositories
              method: GET
              description: "List all repositories."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: organizations
          path: /api/v2/organizations
          description: "Manage organizations."
          operations:
            - name: list-organizations
              method: GET
              description: "List all organizations."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: host-groups
          path: /api/v2/hostgroups
          description: "Manage host groups."
          operations:
            - name: list-host-groups
              method: GET
              description: "List all host groups."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: errata
          path: /katello/api/v2/errata
          description: "Manage errata advisories."
          operations:
            - name: list-errata
              method: GET
              description: "List all available errata."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8105
      namespace: satellite-api
      resources:
        - path: /v1/hosts
          name: hosts
          description: "Managed hosts."
          operations:
            - method: GET
              name: list-hosts
              description: "List all hosts."
              call: "satellite.list-hosts"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/content-views
          name: content-views
          description: "Content views."
          operations:
            - method: GET
              name: list-content-views
              description: "List content views."
              call: "satellite.list-content-views"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/errata
          name: errata
          description: "Errata advisories."
          operations:
            - method: GET
              name: list-errata
              description: "List errata."
              call: "satellite.list-errata"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9105
      namespace: satellite-mcp
      transport: http
      tools:
        - name: list-hosts
          description: "List all managed hosts."
          hints:
            readOnly: true
            openWorld: true
          call: "satellite.list-hosts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-host
          description: "Get a specific host."
          hints:
            readOnly: true
            idempotent: true
          call: "satellite.get-host"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-host-errata
          description: "List errata applicable to a host."
          hints:
            readOnly: true
          call: "satellite.list-host-errata"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-host
          description: "Delete a managed host."
          hints:
            readOnly: false
            destructive: true
          call: "satellite.delete-host"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-content-views
          description: "List all content views."
          hints:
            readOnly: true
          call: "satellite.list-content-views"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-content-view
          description: "Create a new content view."
          hints:
            readOnly: false
          call: "satellite.create-content-view"
          with:
            name: "tools.name"
            organization_id: "tools.organization_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-environments
          description: "List lifecycle environments."
          hints:
            readOnly: true
          call: "satellite.list-environments"
          with:
            organization_id: "tools.organization_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-repositories
          description: "List software repositories."
          hints:
            readOnly: true
          call: "satellite.list-repositories"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-organizations
          description: "List all organizations."
          hints:
            readOnly: true
          call: "satellite.list-organizations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-host-groups
          description: "List all host groups."
          hints:
            readOnly: true
          call: "satellite.list-host-groups"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-errata
          description: "List all available errata."
          hints:
            readOnly: true
          call: "satellite.list-errata"
          outputParameters:
            - type: object
              mapping: "$."
