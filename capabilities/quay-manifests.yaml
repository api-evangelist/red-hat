naftiko: 1.0.0-alpha2
info:
  label: Red Hat Quay API — Manifests
  description: 'Red Hat Quay API — Manifests. 1 operations. Lead operation: Red Hat Get Manifest Security Information. Self-contained
    Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Manifests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: quay-manifests
    baseUri: https://quay.io/api/v1
    description: Red Hat Quay API — Manifests business capability. Self-contained, no shared references.
    resources:
    - name: repository-repository-manifest-manifestref-security
      path: /repository/{repository}/manifest/{manifestref}/security
      operations:
      - name: getmanifestsecurity
        method: GET
        description: Red Hat Get Manifest Security Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: manifestref
          in: path
          type: string
          description: The manifest digest reference.
          required: true
        - name: vulnerabilities
          in: query
          type: boolean
          description: Whether to include detailed vulnerability information.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: quay-manifests-rest
    port: 8080
    description: REST adapter for Red Hat Quay API — Manifests. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/repository/{repository}/manifest/{manifestref}/security
      name: repository-repository-manifest-manifestref-security
      description: REST surface for repository-repository-manifest-manifestref-security.
      operations:
      - method: GET
        name: getmanifestsecurity
        description: Red Hat Get Manifest Security Information
        call: quay-manifests.getmanifestsecurity
        with:
          manifestref: rest.manifestref
          vulnerabilities: rest.vulnerabilities
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quay-manifests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Quay API — Manifests. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: red-hat-get-manifest-security
      description: Red Hat Get Manifest Security Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quay-manifests.getmanifestsecurity
      with:
        manifestref: tools.manifestref
        vulnerabilities: tools.vulnerabilities
      outputParameters:
      - type: object
        mapping: $.
