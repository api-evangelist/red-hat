naftiko: 1.0.0-alpha2
info:
  label: Red Hat Satellite API — Host Groups
  description: 'Red Hat Satellite API — Host Groups. 1 operations. Lead operation: Red Hat List Host Groups. Self-contained
    Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Host Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: satellite-host-groups
    baseUri: https://satellite.example.com
    description: Red Hat Satellite API — Host Groups business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-hostgroups
      path: /api/v2/hostgroups
      operations:
      - name: listhostgroups
        method: GET
        description: Red Hat List Host Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.RED_HAT_USER}}'
      password: '{{env.RED_HAT_PASS}}'
  exposes:
  - type: rest
    namespace: satellite-host-groups-rest
    port: 8080
    description: REST adapter for Red Hat Satellite API — Host Groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v2/hostgroups
      name: api-v2-hostgroups
      description: REST surface for api-v2-hostgroups.
      operations:
      - method: GET
        name: listhostgroups
        description: Red Hat List Host Groups
        call: satellite-host-groups.listhostgroups
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: satellite-host-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Satellite API — Host Groups. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: red-hat-list-host-groups
      description: Red Hat List Host Groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: satellite-host-groups.listhostgroups
      outputParameters:
      - type: object
        mapping: $.
