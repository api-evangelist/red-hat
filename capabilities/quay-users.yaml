naftiko: 1.0.0-alpha2
info:
  label: Red Hat Quay API — Users
  description: 'Red Hat Quay API — Users. 1 operations. Lead operation: Red Hat Get Logged-in User. Self-contained Naftiko
    capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: quay-users
    baseUri: https://quay.io/api/v1
    description: Red Hat Quay API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user
      path: /user/
      operations:
      - name: getloggedinuser
        method: GET
        description: Red Hat Get Logged-in User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: quay-users-rest
    port: 8080
    description: REST adapter for Red Hat Quay API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user
      name: user
      description: REST surface for user.
      operations:
      - method: GET
        name: getloggedinuser
        description: Red Hat Get Logged-in User
        call: quay-users.getloggedinuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quay-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Quay API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: red-hat-get-logged-user
      description: Red Hat Get Logged-in User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quay-users.getloggedinuser
      outputParameters:
      - type: object
        mapping: $.
