naftiko: 1.0.0-alpha2
info:
  label: Red Hat Build of Keycloak Admin REST API — Sessions
  description: 'Red Hat Build of Keycloak Admin REST API — Sessions. 1 operations. Lead operation: Red Hat Remove a Session.
    Self-contained Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: keycloak-admin-sessions
    baseUri: https://keycloak.example.com
    description: Red Hat Build of Keycloak Admin REST API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: admin-realms-realm-sessions-session_id
      path: /admin/realms/{realm}/sessions/{session_id}
      operations:
      - name: deletesession
        method: DELETE
        description: Red Hat Remove a Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: session_id
          in: path
          type: string
          description: The unique identifier of the session.
          required: true
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: keycloak-admin-sessions-rest
    port: 8080
    description: REST adapter for Red Hat Build of Keycloak Admin REST API — Sessions. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/admin/realms/{realm}/sessions/{session-id}
      name: admin-realms-realm-sessions-session-id
      description: REST surface for admin-realms-realm-sessions-session_id.
      operations:
      - method: DELETE
        name: deletesession
        description: Red Hat Remove a Session
        call: keycloak-admin-sessions.deletesession
        with:
          session_id: rest.session_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: keycloak-admin-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Build of Keycloak Admin REST API — Sessions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: red-hat-remove-session
      description: Red Hat Remove a Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: keycloak-admin-sessions.deletesession
      with:
        session_id: tools.session_id
      outputParameters:
      - type: object
        mapping: $.
