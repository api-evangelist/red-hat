naftiko: 1.0.0-alpha2
info:
  label: Red Hat Quay API
  description: 'Red Hat Quay API. 3 operations. Lead operation: Red Hat List Repository Tags. Self-contained Naftiko capability
    covering one Red Hat business surface.'
  tags:
  - Red Hat
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: quay-general
    baseUri: https://quay.io/api/v1
    description: Red Hat Quay API business capability. Self-contained, no shared references.
    resources:
    - name: repository-repository-tag
      path: /repository/{repository}/tag/
      operations:
      - name: listrepositorytags
        method: GET
        description: Red Hat List Repository Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: The page number for pagination.
        - name: limit
          in: query
          type: integer
          description: The maximum number of tags to return.
        - name: specificTag
          in: query
          type: string
          description: Filter to a specific tag name.
    - name: repository-repository-tag-tag
      path: /repository/{repository}/tag/{tag}
      operations:
      - name: changetag
        method: PUT
        description: Red Hat Create or Move a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tag
          in: path
          type: string
          description: The tag name.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletetag
        method: DELETE
        description: Red Hat Delete a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tag
          in: path
          type: string
          description: The tag name to delete.
          required: true
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: quay-general-rest
    port: 8080
    description: REST adapter for Red Hat Quay API. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/repository/{repository}/tag
      name: repository-repository-tag
      description: REST surface for repository-repository-tag.
      operations:
      - method: GET
        name: listrepositorytags
        description: Red Hat List Repository Tags
        call: quay-general.listrepositorytags
        with:
          page: rest.page
          limit: rest.limit
          specificTag: rest.specificTag
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/repository/{repository}/tag/{tag}
      name: repository-repository-tag-tag
      description: REST surface for repository-repository-tag-tag.
      operations:
      - method: PUT
        name: changetag
        description: Red Hat Create or Move a Tag
        call: quay-general.changetag
        with:
          tag: rest.tag
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletetag
        description: Red Hat Delete a Tag
        call: quay-general.deletetag
        with:
          tag: rest.tag
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quay-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat Quay API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: red-hat-list-repository-tags
      description: Red Hat List Repository Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quay-general.listrepositorytags
      with:
        page: tools.page
        limit: tools.limit
        specificTag: tools.specificTag
      outputParameters:
      - type: object
        mapping: $.
    - name: red-hat-create-move-tag
      description: Red Hat Create or Move a Tag
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: quay-general.changetag
      with:
        tag: tools.tag
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: red-hat-delete-tag
      description: Red Hat Delete a Tag
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quay-general.deletetag
      with:
        tag: tools.tag
      outputParameters:
      - type: object
        mapping: $.
