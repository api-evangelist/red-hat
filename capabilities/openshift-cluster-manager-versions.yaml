naftiko: 1.0.0-alpha2
info:
  label: Red Hat OpenShift Cluster Manager API — Versions
  description: 'Red Hat OpenShift Cluster Manager API — Versions. 1 operations. Lead operation: Red Hat List Openshift Versions.
    Self-contained Naftiko capability covering one Red Hat business surface.'
  tags:
  - Red Hat
  - Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RED_HAT_API_KEY: RED_HAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openshift-cluster-manager-versions
    baseUri: https://api.openshift.com
    description: Red Hat OpenShift Cluster Manager API — Versions business capability. Self-contained, no shared references.
    resources:
    - name: api-clusters_mgmt-v1-versions
      path: /api/clusters_mgmt/v1/versions
      operations:
      - name: listversions
        method: GET
        description: Red Hat List Openshift Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RED_HAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: openshift-cluster-manager-versions-rest
    port: 8080
    description: REST adapter for Red Hat OpenShift Cluster Manager API — Versions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/clusters-mgmt/v1/versions
      name: api-clusters-mgmt-v1-versions
      description: REST surface for api-clusters_mgmt-v1-versions.
      operations:
      - method: GET
        name: listversions
        description: Red Hat List Openshift Versions
        call: openshift-cluster-manager-versions.listversions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openshift-cluster-manager-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Red Hat OpenShift Cluster Manager API — Versions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: red-hat-list-openshift-versions
      description: Red Hat List Openshift Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openshift-cluster-manager-versions.listversions
      outputParameters:
      - type: object
        mapping: $.
