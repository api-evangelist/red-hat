naftiko: "1.0.0-alpha1"

info:
  label: "Red Hat Platform Management"
  description: "Unified workflow for managing OpenShift clusters and Quay container registries. Used by platform engineers and DevOps teams to provision clusters, manage machine pools, and maintain container image repositories."
  tags:
    - Red Hat
    - OpenShift
    - Quay
    - Platform Engineering
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      RED_HAT_BEARER_TOKEN: RED_HAT_BEARER_TOKEN
      QUAY_BEARER_TOKEN: QUAY_BEARER_TOKEN

capability:
  consumes:
    - import: openshift-cluster-manager
      location: ./shared/openshift-cluster-manager.yaml
    - import: quay
      location: ./shared/quay.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: platform-management-api
      description: "Unified REST API for OpenShift cluster and Quay registry management."
      resources:
        - path: /v1/clusters
          name: clusters
          description: "OpenShift clusters."
          operations:
            - method: GET
              name: list-clusters
              description: "List all managed clusters."
              call: "openshift-cluster-manager.list-clusters"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-cluster
              description: "Create a new cluster."
              call: "openshift-cluster-manager.create-cluster"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/clusters/{cluster_id}
          name: cluster-detail
          description: "Specific cluster operations."
          operations:
            - method: GET
              name: get-cluster
              description: "Get cluster details."
              call: "openshift-cluster-manager.get-cluster"
              with:
                cluster_id: "rest.cluster_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-cluster
              description: "Delete a cluster."
              call: "openshift-cluster-manager.delete-cluster"
              with:
                cluster_id: "rest.cluster_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/clusters/{cluster_id}/machine-pools
          name: machine-pools
          description: "Cluster machine pools."
          operations:
            - method: GET
              name: list-machine-pools
              description: "List machine pools."
              call: "openshift-cluster-manager.list-machine-pools"
              with:
                cluster_id: "rest.cluster_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cloud-providers
          name: cloud-providers
          description: "Available cloud providers."
          operations:
            - method: GET
              name: list-cloud-providers
              description: "List cloud providers."
              call: "openshift-cluster-manager.list-cloud-providers"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/versions
          name: versions
          description: "OpenShift versions."
          operations:
            - method: GET
              name: list-versions
              description: "List OpenShift versions."
              call: "openshift-cluster-manager.list-versions"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/repositories
          name: repositories
          description: "Container image repositories."
          operations:
            - method: GET
              name: list-repositories
              description: "List container repositories."
              call: "quay.list-repositories"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-repository
              description: "Create a container repository."
              call: "quay.create-repository"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/repositories/{repository}/tags
          name: tags
          description: "Image tags."
          operations:
            - method: GET
              name: list-repository-tags
              description: "List image tags."
              call: "quay.list-repository-tags"
              with:
                repository: "rest.repository"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/repositories/{repository}/manifests/{manifestref}/security
          name: manifest-security
          description: "Image vulnerability scanning."
          operations:
            - method: GET
              name: get-manifest-security
              description: "Get vulnerability scan results."
              call: "quay.get-manifest-security"
              with:
                repository: "rest.repository"
                manifestref: "rest.manifestref"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9080
      namespace: platform-management-mcp
      transport: http
      description: "MCP server for AI-assisted OpenShift and Quay management."
      tools:
        - name: list-clusters
          description: "List all managed OpenShift clusters."
          hints:
            readOnly: true
            openWorld: true
          call: "openshift-cluster-manager.list-clusters"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-cluster
          description: "Get details of a specific cluster."
          hints:
            readOnly: true
            idempotent: true
          call: "openshift-cluster-manager.get-cluster"
          with:
            cluster_id: "tools.cluster_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-cluster
          description: "Create a new OpenShift cluster."
          hints:
            readOnly: false
          call: "openshift-cluster-manager.create-cluster"
          with:
            name: "tools.name"
            cloud_provider: "tools.cloud_provider"
            region: "tools.region"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-cluster
          description: "Delete an OpenShift cluster."
          hints:
            readOnly: false
            destructive: true
          call: "openshift-cluster-manager.delete-cluster"
          with:
            cluster_id: "tools.cluster_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-machine-pools
          description: "List machine pools for a cluster."
          hints:
            readOnly: true
          call: "openshift-cluster-manager.list-machine-pools"
          with:
            cluster_id: "tools.cluster_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-cloud-providers
          description: "List available cloud providers."
          hints:
            readOnly: true
          call: "openshift-cluster-manager.list-cloud-providers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-versions
          description: "List available OpenShift versions."
          hints:
            readOnly: true
          call: "openshift-cluster-manager.list-versions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-addons
          description: "List available cluster add-ons."
          hints:
            readOnly: true
          call: "openshift-cluster-manager.list-addons"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-subscriptions
          description: "List cluster subscriptions."
          hints:
            readOnly: true
          call: "openshift-cluster-manager.list-subscriptions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-repositories
          description: "List container image repositories."
          hints:
            readOnly: true
            openWorld: true
          call: "quay.list-repositories"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-repository
          description: "Get container repository details."
          hints:
            readOnly: true
            idempotent: true
          call: "quay.get-repository"
          with:
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-repository
          description: "Create a new container repository."
          hints:
            readOnly: false
          call: "quay.create-repository"
          with:
            namespace: "tools.namespace"
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-repository-tags
          description: "List tags for a container image."
          hints:
            readOnly: true
          call: "quay.list-repository-tags"
          with:
            repository: "tools.repository"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-manifest-security
          description: "Get vulnerability scan results for a container image."
          hints:
            readOnly: true
          call: "quay.get-manifest-security"
          with:
            repository: "tools.repository"
            manifestref: "tools.manifestref"
          outputParameters:
            - type: object
              mapping: "$."
