reconciled: false
tags:
  - Enterprise Software
  - Subscription
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps framing for the Red Hat umbrella subscription business. The
  fully reconciled meter list lives at the product-repo level (RHEL, OpenShift, Satellite, 3scale).
sources:
  - https://www.redhat.com/en/about/pricing
notes: Umbrella red-hat artifact captures only the cross-product subscription shape; per-product
  meters (RHEL socket-pair, OpenShift core-hour, Satellite managed-host, 3scale call) belong in
  the per-product repos.
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Red Hat
  ServiceCategory: Enterprise Software Subscription
  ProviderName: Red Hat
  PublisherName: Red Hat, Inc.
  InvoiceIssuerName: Red Hat, Inc.
  BillingCurrency: USD
meters:
  - name: subscription_term
    description: Annual or multi-year subscription line per Red Hat product SKU
    unit: contract
    aggregation: sum
    dimensions:
      - product_sku
      - support_level
      - term_length
principles:
  - name: Visibility
    description: Use the Red Hat Customer Portal subscription views and Subscription Management
      service to inventory active SKUs and entitlement consumption across the estate.
  - name: Allocation
    description: Tag subscriptions to consuming business units via the Customer Portal account
      structure or via internal CMDB linkage; entitlements can be partitioned by environment.
  - name: Optimization
    description: Consolidate to multi-year terms for discount, right-size between Standard and
      Premium support, and align the Red Hat product mix at renewal.
  - name: Accountability
    description: Procurement holds the Red Hat master agreement; platform engineering owns
      consumption against the entitlements.
maintainers:
