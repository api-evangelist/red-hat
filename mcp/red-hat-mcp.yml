description: >-
  Red Hat ships official Model Context Protocol servers as part of its AI
  portfolio rather than a single company-wide hosted endpoint. The primary one
  is the MCP server for Red Hat OpenShift (technology preview), which gives LLM
  agents governed access to a cluster's Kubernetes/OpenShift API; OpenShift
  Lightspeed embeds a read-only MCP server for the same purpose. Red Hat also
  operates an MCP catalog on OpenShift AI for discovering and deploying servers.
  These are deployed into a customer's own cluster (stdio / in-cluster
  transport), not a public multi-tenant URL, so no fixed hosted URL is recorded.
