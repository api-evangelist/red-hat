method: searched
source: >-
  https://developers.redhat.com/openshift/REST-API-client-libraries and the
  public package registries (PyPI, pkg.go.dev, Maven Central, npm). Registry
  HTTP status recorded at fetch time. Red Hat's client-library surface is spread
  across its product upstreams (OpenShift, Ansible/AWX, Keycloak, PatternFly);
  official:true is set only for libraries published by Red Hat or the Red
  Hat-sponsored upstream project.
description: >-
  First-party and Red Hat-sponsored-upstream client libraries, SDKs, and CLIs
  across the Red Hat product portfolio. Because OpenShift is built on Kubernetes,
  any Kubernetes API client library also works against the OpenShift API; only
  the Red Hat / OpenShift-specific clients are listed here.
