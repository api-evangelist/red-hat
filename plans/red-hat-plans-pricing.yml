description: Red Hat sells subscription-based access to enterprise open-source products. The
  corporate pricing landing page does not publish per-plan numbers; commercial terms are routed
  through "Talk to a Red Hatter" or Contact Sales. Some product-specific list prices appear on
  the Red Hat Store and are captured in the per-product repos (RHEL, OpenShift, Satellite, 3scale).
sources:
  - https://www.redhat.com/en/about/pricing
notes: The umbrella red-hat pricing page is contact-sales; concrete list prices live on the Red
  Hat Store and in the per-product repos.
plans:
  - id: red-hat-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Red Hat subscriptions are quoted by sales based on product, sizing, support
      level, term length, and deployment footprint.
    entries:
      - label: Custom subscription
        name: custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Production support (Standard or Premium)
      - name: Multi-year term discounts
      - name: Volume discounts negotiated with sales
