openapi: 3.2.0
info:
  title: Red Hat Build of Keycloak Admin REST Sessions API
  description: The Red Hat Build of Keycloak Admin REST API provides programmatic access to manage identity and access management functions, including realm configuration, user management, client registration, role assignments, identity provider configuration, and session management. It serves as the administrative interface for the Red Hat build of Keycloak identity platform.
  version: '26.0'
  contact:
    name: Red Hat Support
    url: https://access.redhat.com/support
  termsOfService: https://www.redhat.com/en/about/terms-use
servers:
- url: https://keycloak.example.com
  description: Keycloak Server
security:
- bearerAuth: []
tags:
- name: Sessions
  description: Operations for viewing and managing active user sessions across a realm.
paths:
  /admin/realms/{realm}/sessions/{session_id}:
    delete:
      operationId: deleteSession
      summary: Red Hat Remove a Session
      description: Terminates a specific user session, logging the user out of the associated client application.
      tags:
      - Sessions
      parameters:
      - $ref: '#/components/parameters/RealmParam'
      - name: session_id
        in: path
        required: true
        description: The unique identifier of the session.
        schema:
          type: string
        example: '500123'
      responses:
        '204':
          description: Session terminated successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    RealmParam:
      name: realm
      in: path
      required: true
      description: The name of the Keycloak realm.
      schema:
        type: string
  responses:
    NotFoundError:
      description: The requested resource was not found.
    UnauthorizedError:
      description: Authentication credentials are missing or invalid.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained via direct access grant or authorization code flow from the Keycloak master realm or configured realm.
externalDocs:
  description: Red Hat Build of Keycloak Admin REST API Documentation
  url: https://docs.redhat.com/en/documentation/red_hat_build_of_keycloak/26.0/html/server_developer_guide/admin_rest_api
