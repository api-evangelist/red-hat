specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Red Hat
providerId: red-hat
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Enterprise Software
  - Subscription
  - Rate Limiting
description: Red Hat is a software-subscription business; the umbrella corporate brand does not
  itself expose a single rate-limited API. Rate limits are enforced per Red Hat product (Customer
  Portal, Subscription Management, OpenShift control plane, 3scale-managed APIs, Satellite) and
  are captured in the corresponding per-product repos.
sources:
  - https://www.redhat.com/en/about/pricing
notes: No platform-wide rate-limit policy is published at the red-hat umbrella level; consult
  the product-specific artifacts for concrete limits.
responseCodes: {}
limits:
  - name: Per-product
    scope: account
    metric: varies
    limit: 'see per-product repo (red-hat-3scale, red-hat-openshift, red-hat-satellite, etc.)'
policies:
  - name: Product-level Enforcement
    description: Throttling is implemented in each Red Hat product runtime rather than as an
      umbrella corporate policy.
maintainers:
