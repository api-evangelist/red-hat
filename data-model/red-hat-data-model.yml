source: >-
  Derived from the component schemas and id-reference fields in openapi/*.yml
  across the six spec-bearing Red Hat products (OpenShift Cluster Manager,
  Ansible Automation Platform, Red Hat build of Keycloak, Red Hat Insights,
  Red Hat Quay, Red Hat Satellite). Each product is a distinct domain; entities
  and relationships are grouped by product because the APIs do not share a single
  object graph.
notation: >-
  relationships use has_one / has_many / belongs_to with the reference field name;
  direction is from the entity that owns the reference.
domains:
  - product: OpenShift Cluster Manager
    source: openapi/red-hat-openshift-cluster-manager-openapi.yml
    entities:
      - {name: Cluster, domain: clusters_mgmt, description: A managed OpenShift cluster.}
      - {name: MachinePool, domain: clusters_mgmt, description: A pool of worker machines within a cluster.}
      - {name: IdentityProvider, domain: clusters_mgmt, description: An IdP configured on a cluster.}
      - {name: Subscription, domain: accounts_mgmt, description: A subscription entitling a cluster.}
      - {name: CloudProvider, domain: clusters_mgmt, description: A cloud provider a cluster can run on.}
      - {name: CloudRegion, domain: clusters_mgmt, description: A region within a cloud provider.}
      - {name: Version, domain: clusters_mgmt, description: An available OpenShift version.}
      - {name: Addon, domain: clusters_mgmt, description: An installable cluster add-on.}
    relationships:
      - {from: Cluster, to: MachinePool, kind: has_many, via: cluster_id}
      - {from: Cluster, to: IdentityProvider, kind: has_many, via: cluster_id}
      - {from: Cluster, to: CloudProvider, kind: belongs_to, via: cloud_provider}
      - {from: Cluster, to: CloudRegion, kind: belongs_to, via: region}
      - {from: Cluster, to: Version, kind: belongs_to, via: version}
      - {from: Cluster, to: Subscription, kind: belongs_to, via: subscription_id}
  - product: Ansible Automation Platform
