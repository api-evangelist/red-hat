      - {name: Credential, description: A stored secret used by jobs.}
    relationships:
      - {from: JobTemplate, to: Inventory, kind: belongs_to, via: inventory}
      - {from: JobTemplate, to: Project, kind: belongs_to, via: project}
      - {from: JobTemplate, to: Job, kind: has_many, via: job_template}
      - {from: Job, to: JobTemplate, kind: belongs_to, via: job_template}
      - {from: JobTemplate, to: Credential, kind: has_many, via: credentials}
  - product: Red Hat build of Keycloak
